name: CI

# Automatic checks on every push/PR to main.
# Added in 0da6f94 (security suite + pytest). Not an app runtime file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    # Prevent hung GUI/Qt tests from burning the free-minute pool for hours
    timeout-minutes: 15
    env:
      # Avoid UnicodeEncodeError when scripts print Korean on cp1252 consoles
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # Headless runner: without this, QApplication (titlebar / clone-history
      # tests) can block forever waiting for a display — CI looked "stuck".
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest (P0/P1/P2 security)
        # --timeout: fail a single stuck test instead of burning the job for hours
        # faulthandler_timeout: dump stacks if a test freezes past that
        run: >
          python -m pytest tests/ -v --tb=short
          --timeout=45 --timeout-method=thread
          -o faulthandler_timeout=60

      - name: Git terms glossary lint
        run: python scripts/lint_git_terms.py app/ui/git_terms_ko.py

      - name: Security crosscheck
        run: python scripts/verify_security_crosscheck.py

      - name: PII / safety crosscheck
        run: python scripts/verify_pii_crosscheck.py
