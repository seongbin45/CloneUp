name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest (P0/P1/P2 security)
        run: python -m pytest tests/ -v --tb=short

      - name: Security crosscheck
        run: python scripts/verify_security_crosscheck.py

      - name: PII / safety crosscheck
        run: python scripts/verify_pii_crosscheck.py
